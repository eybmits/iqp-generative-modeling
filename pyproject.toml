[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iqp-repro"
version = "0.1.0"
description = "Code and data for Parity Supervision as a Driver of Generalization in Quantum Generative Modeling"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy==2.3.3", "scipy==1.16.3", "matplotlib==3.10.6", "torch==2.10.0"]

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[project.scripts]
iqp-repro = "iqp_repro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iqp_repro = ["data/reference/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
